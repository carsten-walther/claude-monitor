# ═══════════════════════════════════════════════════════════
#  Claude Monitor
#  Claude Monitor
#  Board: Sunton ESP32-2432S024R (CYD, 2.4" ILI9341 + XPT2046)
# 
#  CYD (ESP32-2432S024R)
#  Pins taken from the Sunton board definition:
#  TFT   ILI9341  SCLK 14 / MOSI 13 / MISO 12 / CS 15 / DC 2, no reset
#  Touch XPT2046  same bus, CS 33, IRQ 36
#  Backlight 27, RGB LED 4/16/17 (active low), LDR 34, speaker amp 26
#  SD card on its own bus: CS 5 / MOSI 23 / SCLK 18 / MISO 19
# ═══════════════════════════════════════════════════════════

substitutions:
  project_name: claude-monitor
  author_name: carsten-walther
  friendly_name: Claude Monitor
  comment: Claude Monitor
  version: 2026.9.7
  area: Miscellaneous

  PIN_SPEAKER: GPIO26

  PIN_TFT_SCLK: GPIO14
  PIN_TFT_MOSI: GPIO13
  PIN_TFT_MISO: GPIO12
  PIN_TFT_CS: GPIO15
  PIN_TFT_DC: GPIO2

  PIN_TOUCH_CS: GPIO33
  PIN_TOUCH_IRQ: GPIO36

  PIN_BACKLIGHT: GPIO27

  PIN_LED_R: GPIO4
  PIN_LED_G: GPIO17
  PIN_LED_B: GPIO16

  PIN_LDR: GPIO34

  # Host-Daemon für Claude-Code-Token-Verbrauch (claude-monitor/daemon/).
  # IP ist die aktuelle LAN-IP des Mac im selben Netz wie das Gerät -
  # bei DHCP-Wechsel hier anpassen.
  USAGE_DAEMON_URL: http://192.168.178.86:8787/usage

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"
  min_version: 2026.2.0
  project:
    name: "${author_name}.${project_name}"
    version: "${version}"
  on_boot:
    - priority: -100
      then:
        - delay: 3s
        - light.turn_off:
            id: backlight
            transition_length: 400ms
        - delay: 400ms
        - lvgl.page.show: canvas_2
        - delay: 50ms
        - light.turn_on:
            id: backlight
            transition_length: 400ms

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32dev
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

#
# https://esphome.io/components/esphome#preferences
#
preferences:
  flash_write_interval: 5min

#
# https://esphome.io/components/wifi
#
wifi:
  id: wifi_id
  networks:
    - ssid: !secret wifi_ssid_home
      password: !secret wifi_password_home
    - ssid: !secret wifi_ssid_work
      password: !secret wifi_password_work
  domain: .local
  fast_connect: false
  power_save_mode: NONE
  enable_on_boot: true
  output_power: 12dB
  ap:
    ssid: "${project_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    then:
      - lvgl.widget.update:
          id: lbl_wifi_connected
          text_color: 0x444444

#
# https://esphome.io/components/captive_portal
#
captive_portal:

#
# https://esphome.io/components/ota
#
ota:
  - platform: esphome
    password: !secret ota_password

#
# https://esphome.io/components/web_server
#
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

#
# https://esphome.io/components/logger
#
logger:
  level: DEBUG

#
# https://esphome.io/components/time/sntp
#
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - script.execute: clock_show
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_show

#
# https://esphome.io/components/spi
#
spi:
  - id: spi_bus
    clk_pin: ${PIN_TFT_SCLK}
    mosi_pin: ${PIN_TFT_MOSI}
    miso_pin:
      number: ${PIN_TFT_MISO}
      ignore_strapping_warning: true

#
# https://esphome.io/components/http_request
# Pollt den lokalen Usage-Daemon (claude-monitor/daemon/), siehe interval unten.
#
http_request:
  timeout: 5s
  verify_ssl: false

#
# https://esphome.io/components/esp32_ble_server
# BLE-Fallback fuer Usage-Daten, wenn der Mac-Daemon den ESP32 nicht per WLAN
# erreicht. Gleiche UUIDs muessen im Daemon (claude-monitor/daemon/) verwendet werden.
#
esp32_ble_server:
  manufacturer: "${author_name}"
  services:
    - uuid: "c1a0d000-0000-1000-8000-00805f9b34fb"
      characteristics:
        - uuid: "c1a0d001-0000-1000-8000-00805f9b34fb"
          write: true
          write_no_response: true
          on_write:
            then:
              - script.execute:
                  id: apply_usage_json
                  json_body: !lambda 'return std::string(x.begin(), x.end());'
  on_connect:
    then:
      - lvgl.widget.update:
          id: lbl_ble_connected
          text_color: 0xFFFFFF
  on_disconnect:
    then:
      - lvgl.widget.update:
          id: lbl_ble_connected
          text_color: 0x444444

#
# https://esphome.io/components/globals
# Zwischenspeicher für die per http_request.get abgefragten Nutzungswerte.
#
globals:
  - id: usage_current_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_current_reset_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_weekly_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_weekly_reset_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: anim_word_idx
    type: int
    restore_value: false
    initial_value: '0'

#
# https://esphome.io/components/interval
# Fragt alle 60s Current-/Weekly-Tokenverbrauch beim Host-Daemon ab.
#
interval:
  - interval: 60s
    then:
      - http_request.get:
          url: ${USAGE_DAEMON_URL}
          request_headers:
            X-Auth: !secret usage_daemon_secret
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code == 200;'
                  then:
                    - lvgl.widget.update:
                        id: lbl_claude_connected
                        text_color: 0xFFFFFF
                    - script.execute:
                        id: apply_usage_json
                        json_body: !lambda 'return body;'
                  else:
                    - lvgl.widget.update:
                        id: lbl_claude_connected
                        text_color: 0x444444
                    - logger.log:
                        format: "Usage-Daemon antwortet mit Status %d"
                        args: ["response->status_code"]
                        level: WARN
          on_error:
            then:
              - lvgl.widget.update:
                  id: lbl_claude_connected
                  text_color: 0x444444
              - logger.log:
                  format: "Usage-Daemon nicht erreichbar"
                  level: WARN

  # Rein dekorative "Denk"-Animation, unabhängig von echten Anfragen -
  # rotiert wie beim Vorbild (Clawdmeter) durch eine feste Wortliste.
  - interval: 4s
    then:
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            static const char *const WORDS[] = {
              "Accomplishing", "Elucidating", "Perusing", "Actioning", "Enchanting",
              "Philosophising", "Actualizing", "Envisioning", "Pondering", "Baking",
              "Finagling", "Pontificating", "Booping", "Flibbertigibbeting", "Processing",
              "Brewing", "Forging", "Puttering", "Calculating", "Forming", "Puzzling",
              "Cerebrating", "Frolicking", "Reticulating", "Channelling", "Generating",
              "Ruminating", "Churning", "Germinating", "Scheming", "Clauding", "Hatching",
              "Schlepping", "Coalescing", "Herding", "Shimmying", "Cogitating", "Honking",
              "Shucking", "Combobulating", "Hustling", "Simmering", "Computing", "Ideating",
              "Smooshing", "Concocting", "Imagining", "Spelunking", "Conjuring", "Incubating",
              "Spinning", "Considering", "Inferring", "Stewing", "Contemplating", "Jiving",
              "Sussing", "Cooking", "Manifesting", "Synthesizing", "Crafting", "Marinating",
              "Thinking", "Creating", "Meandering", "Tinkering", "Crunching", "Moseying",
              "Transmuting", "Deciphering", "Mulling", "Unfurling", "Deliberating", "Mustering",
              "Unravelling", "Determining", "Musing", "Vibing", "Discombobulating", "Noodling",
              "Wandering", "Divining", "Percolating", "Whirring", "Doing", "Wibbling",
              "Effecting", "Wizarding", "Working", "Wrangling",
            };
            static const size_t WORDS_COUNT = sizeof(WORDS) / sizeof(WORDS[0]);
            int idx = id(anim_word_idx);
            id(anim_word_idx) = (idx + 1) % WORDS_COUNT;
            return std::string(WORDS[idx]) + "...";

#
# https://esphome.io/components/script
#
script:
  - id: clock_show
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: lbl_time
                text: !lambda 'return id(sntp_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: lbl_date
                text: !lambda 'return id(sntp_time).now().strftime("%d.%m.%Y");'

  # Gemeinsames Update fuer Usage-Daten, egal ob per HTTP (WLAN) oder BLE-Write empfangen.
  - id: apply_usage_json
    mode: single
    parameters:
      json_body: string
    then:
      - lambda: |-
          json::parse_json(json_body, [](JsonObject root) -> bool {
            if (root["current"].is<int>()) id(usage_current_pct) = root["current"];
            if (root["current_reset_min"].is<int>()) id(usage_current_reset_min) = root["current_reset_min"];
            if (root["weekly"].is<int>()) id(usage_weekly_pct) = root["weekly"];
            if (root["weekly_reset_min"].is<int>()) id(usage_weekly_reset_min) = root["weekly_reset_min"];
            return true;
          });
      - lvgl.bar.update:
          id: bar_usage_current
          value: !lambda 'return id(usage_current_pct);'
      - lvgl.bar.update:
          id: bar_usage_weekly
          value: !lambda 'return id(usage_weekly_pct);'
      - lvgl.label.update:
          id: lbl_usage_current_pct
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(usage_current_pct));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_weekly_pct
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(usage_weekly_pct));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_current_reset
          text: !lambda |-
            int m = id(usage_current_reset_min);
            char buf[24];
            snprintf(buf, sizeof(buf), "Resets in %dh %02dm", m / 60, m % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_weekly_reset
          text: !lambda |-
            int m = id(usage_weekly_reset_min);
            char buf[24];
            snprintf(buf, sizeof(buf), "Resets in %dd %dh", m / 1440, (m % 1440) / 60);
            return std::string(buf);

#
# https://esphome.io/components/output
#
output:
  - id: backlight_pwm
    platform: ledc
    pin: ${PIN_BACKLIGHT}
  - id: led_r
    platform: ledc
    pin:
      number: ${PIN_LED_R}
      inverted: true
  - id: led_g
    platform: ledc
    pin:
      number: ${PIN_LED_G}
      inverted: true
  - id: led_b
    platform: ledc
    pin:
      number: ${PIN_LED_B}
      inverted: true

#
# https://esphome.io/components/light
#
light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    internal: true
    restore_mode: ALWAYS_ON
  - id: status_rgb
    platform: rgb
    name: Status LED
    internal: true
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

#
# https://esphome.io/components/text_sensor/wifi_info
#
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        then:
          - lvgl.widget.update:
              id: lbl_wifi_connected
              text_color: !lambda |-
                return lv_color_hex((x.empty() || x == "0.0.0.0") ? 0x444444 : 0xFFFFFF);
          - lvgl.label.update:
              id: lbl_ip
              text: !lambda 'return x;'
  # DEAKTIVIERT: hängt an sd_mmc_card, siehe Kommentar dort.
  # - platform: sd_mmc_card
  #   sd_mmc_card_id: sd_card
  #   sd_card_type:
  #     id: sd_card_type
  #     internal: true
  #     on_value:
  #       then:
  #         - lvgl.widget.update:
  #             id: lbl_sd
  #             text_color: 0xFFFFFF

#
# https://esphome.io/components/sensor
#
sensor:
  - platform: template
    name: "Heap Free"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:memory
    update_interval: 60s
    lambda: 'return (float) esp_get_free_heap_size();'
  - platform: template
    name: "Heap Largest Block"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:memory
    update_interval: 60s
    lambda: 'return (float) heap_caps_get_largest_free_block(MALLOC_CAP_DEFAULT);'
  - platform: adc
    pin: ${PIN_LDR}
    name: Ambient Light
    internal: true
    id: ambient_light
    attenuation: 12db
    update_interval: 30s

#
# https://esphome.io/components/display
#
display:
  - platform: mipi_spi
    id: esp_display
    # model: ESP32-2432S028
    model: ESP32-2432S028-7789
    spi_id: spi_bus
    cs_pin:
      number: ${PIN_TFT_CS}
      ignore_strapping_warning: true
    dc_pin:
      number: ${PIN_TFT_DC}
      ignore_strapping_warning: true
    data_rate: 40MHz
    color_order: BGR
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

#
# https://esphome.io/components/touchscreen
#
touchscreen:
  platform: xpt2046
  id: esp_touch
  spi_id: spi_bus
  cs_pin: ${PIN_TOUCH_CS}
  interrupt_pin: ${PIN_TOUCH_IRQ}
  data_rate: 2MHz
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 270
    x_max: 3870
    y_min: 420
    y_max: 3790
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: true

#
# https://esphome.io/components/image
#
image:
  - platform: file
    file: "img/claude-code-32.png"
    type: RGB
    transparency: alpha_channel
    id: claude_image_32
    resize: 32x20
  - platform: file
    file: "img/claude-code-128.png"
    type: RGB
    transparency: alpha_channel
    id: claude_image_128
    resize: 128x80

#
# https://esphome.io/components/lvgl
#
lvgl:
  buffer_size: 10%
  rotation: 90°
  theme:
    dark_mode: true
  pages:
    - id: canvas_1
      bg_color: 0x000000
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: lbl_splash_name
            x: 0
            y: 40
            align: TOP_MID
            text: "${friendly_name}"
            text_color: 0xFFFFFF
            text_align: CENTER
            text_font: montserrat_28
        - image:
            id: lv_image_claude_128
            src: claude_image_128
            x: 0
            y: 120
            width: 128
            height: 80
            align: TOP_MID
        - label:
            id: lbl_splash_version
            x: 0
            y: -10
            align: BOTTOM_MID
            text: "Version ${version}"
            text_color: 0xFFFFFF
            text_align: CENTER
            text_font: montserrat_14

    - id: canvas_2
      bg_color: 0x000000
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: lv_obj_status_bar_top
            x: 0
            y: 0
            width: 240
            height: 18
            align: TOP_MID
            bg_color: 0xFFFFFF
            bg_opa: 0%
            border_width: 0
            border_color: 0xE0E0E0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  id: lbl_time
                  x: 0
                  y: 0
                  align: TOP_LEFT
                  text: "--:--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_14
              - obj:
                  id: lv_obj_status_bar_icons
                  x: 0
                  y: 0
                  width: 55
                  height: 18
                  align: TOP_MID
                  bg_color: 0xFFFFFF
                  bg_opa: 0%
                  border_width: 0
                  border_color: 0xE0E0E0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        id: lbl_wifi_connected
                        x: 0
                        y: 0
                        align: TOP_LEFT
                        text: "\uF1EB"
                        text_font: montserrat_12
                        text_align: CENTER
                        text_color: 0x444444
                    - label:
                        id: lbl_ble_connected
                        x: 3
                        y: 0
                        align: TOP_MID
                        text: "\uF293"
                        text_font: montserrat_12
                        text_align: CENTER
                        text_color: 0x444444
                    - label:
                        id: lbl_claude_connected
                        x: 0
                        y: 0
                        align: TOP_RIGHT
                        text: "\uF0E7"
                        text_font: montserrat_12
                        text_align: CENTER
                        text_color: 0x444444
              - label:
                  id: lbl_date
                  x: 0
                  y: 0
                  align: TOP_RIGHT
                  text: "--.--.----"
                  text_color: 0xFFFFFF
                  text_font: montserrat_14

        - obj:
            id: lv_obj_bars
            x: 0
            y: 0
            width: 240
            height: 280
            align: CENTER
            bg_color: 0xFFFFFF
            bg_opa: 0%
            border_width: 0
            border_color: 0x000000
            pad_all: 4
