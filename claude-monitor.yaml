# ═══════════════════════════════════════════════════════════
#  Claude Monitor
#  Board: Sunton ESP32-2432S024R (CYD, 2.4" ILI9341 + XPT2046)
# 
#  CYD (ESP32-2432S024R)
#  Pins taken from the Sunton board definition:
#  TFT   ILI9341  SCLK 14 / MOSI 13 / MISO 12 / CS 15 / DC 2, no reset
#  Touch XPT2046  same bus, CS 33, IRQ 36
#  Backlight 27, RGB LED 4/16/17 (active low), LDR 34, speaker amp 26
#  SD card on its own bus: CS 5 / MOSI 23 / SCLK 18 / MISO 19
# ═══════════════════════════════════════════════════════════

substitutions:
  project_name: claude-monitor
  author_name: carsten-walther
  friendly_name: Claude Monitor
  comment: Claude Monitor
  version: 2026.9.7
  area: Miscellaneous

  PIN_SPEAKER: GPIO26

  PIN_TFT_SCLK: GPIO14
  PIN_TFT_MOSI: GPIO13
  PIN_TFT_MISO: GPIO12
  PIN_TFT_CS: GPIO15
  PIN_TFT_DC: GPIO2

  PIN_TOUCH_CS: GPIO33
  PIN_TOUCH_IRQ: GPIO36

  PIN_BACKLIGHT: GPIO27

  PIN_LED_R: GPIO4
  PIN_LED_G: GPIO17
  PIN_LED_B: GPIO16

  PIN_LDR: GPIO34

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"
  min_version: 2026.2.0
  project:
    name: "${author_name}.${project_name}"
    version: "${version}"
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            setenv("TZ", "CET-1CEST,M3.5.0,M10.5.0/3", 1);
            tzset();
        - delay: 3s
        - light.turn_off:
            id: backlight
            transition_length: 400ms
        - delay: 400ms
        - lvgl.page.show: main_screen
        - delay: 50ms
        - light.turn_on:
            id: backlight
            transition_length: 400ms

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32dev
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

#
# https://esphome.io/components/esphome#preferences
#
preferences:
  flash_write_interval: 5min

#
# https://esphome.io/components/logger
#
logger:
  level: DEBUG

#
# https://esphome.io/components/json
# Wird von apply_usage_json (json::parse_json) benoetigt - kam bisher indirekt
# ueber http_request mit rein, jetzt ohne WLAN explizit noetig.
#
json:

#
# https://esphome.io/components/spi
#
spi:
  - id: spi_bus
    clk_pin: ${PIN_TFT_SCLK}
    mosi_pin: ${PIN_TFT_MOSI}
    miso_pin:
      number: ${PIN_TFT_MISO}
      ignore_strapping_warning: true

#
# https://esphome.io/components/esp32_ble_server
# Einziger Kommunikationsweg fuer Usage-Daten (kein WLAN mehr). Gleiche UUIDs
# muessen im Daemon (claude-monitor/daemon/) verwendet werden.
#
esp32_ble_server:
  manufacturer: "${author_name}"
  services:
    - uuid: "c1a0d000-0000-1000-8000-00805f9b34fb"
      characteristics:
        - uuid: "c1a0d001-0000-1000-8000-00805f9b34fb"
          write: true
          write_no_response: true
          on_write:
            then:
              - script.execute:
                  id: apply_usage_json
                  json_body: !lambda 'return std::string(x.begin(), x.end());'
  on_connect:
    then:
      - lvgl.widget.update:
          id: lbl_ble_connected
          text_color: 0xFFFFFF
  on_disconnect:
    then:
      - lvgl.widget.update:
          id: lbl_ble_connected
          text_color: 0x444444

#
# https://esphome.io/components/globals
# Zwischenspeicher für die per BLE-Write empfangenen Nutzungswerte.
#
globals:
  - id: usage_current_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_current_reset_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_weekly_pct
    type: int
    restore_value: false
    initial_value: '0'
  - id: usage_weekly_reset_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: anim_word_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: time_synced
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: claude_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: claude_project
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: claude_waiting
    type: bool
    restore_value: false
    initial_value: 'false'

#
# https://esphome.io/components/interval
#
interval:
  # Zeigt die per BLE (settimeofday, siehe apply_usage_json) gesetzte Lokalzeit an.
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            if (!id(time_synced)) return "";
            time_t now = time(nullptr);
            struct tm t;
            localtime_r(&now, &t);
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.tm_hour, t.tm_min);
            return std::string(buf);

  # Rein dekorative "Denk"-Animation, unabhängig von echten Anfragen -
  # rotiert wie beim Vorbild (Clawdmeter) durch eine feste Wortliste.
  - interval: 4s
    then:
      - lvgl.label.update:
          id: lbl_animated_text
          text: !lambda |-
            static const char *const WORDS[] = {
              "Accomplishing", "Elucidating", "Perusing", "Actioning", "Enchanting",
              "Philosophising", "Actualizing", "Envisioning", "Pondering", "Baking",
              "Finagling", "Pontificating", "Booping", "Flibbertigibbeting", "Processing",
              "Brewing", "Forging", "Puttering", "Calculating", "Forming", "Puzzling",
              "Cerebrating", "Frolicking", "Reticulating", "Channelling", "Generating",
              "Ruminating", "Churning", "Germinating", "Scheming", "Clauding", "Hatching",
              "Schlepping", "Coalescing", "Herding", "Shimmying", "Cogitating", "Honking",
              "Shucking", "Combobulating", "Hustling", "Simmering", "Computing", "Ideating",
              "Smooshing", "Concocting", "Imagining", "Spelunking", "Conjuring", "Incubating",
              "Spinning", "Considering", "Inferring", "Stewing", "Contemplating", "Jiving",
              "Sussing", "Cooking", "Manifesting", "Synthesizing", "Crafting", "Marinating",
              "Thinking", "Creating", "Meandering", "Tinkering", "Crunching", "Moseying",
              "Transmuting", "Deciphering", "Mulling", "Unfurling", "Deliberating", "Mustering",
              "Unravelling", "Determining", "Musing", "Vibing", "Discombobulating", "Noodling",
              "Wandering", "Divining", "Percolating", "Whirring", "Doing", "Wibbling",
              "Effecting", "Wizarding", "Working", "Wrangling",
            };
            static const size_t WORDS_COUNT = sizeof(WORDS) / sizeof(WORDS[0]);
            int idx = id(anim_word_idx);
            id(anim_word_idx) = (idx + 1) % WORDS_COUNT;
            return std::string(WORDS[idx]) + "...";

#
# https://esphome.io/components/script
#
script:
  # Gemeinsames Update fuer Usage-Daten, per BLE-Write empfangen.
  - id: apply_usage_json
    mode: single
    parameters:
      json_body: string
    then:
      - lambda: |-
          json::parse_json(json_body, [](JsonObject root) -> bool {
            if (root["current"].is<int>()) id(usage_current_pct) = root["current"];
            if (root["current_reset_min"].is<int>()) id(usage_current_reset_min) = root["current_reset_min"];
            if (root["weekly"].is<int>()) id(usage_weekly_pct) = root["weekly"];
            if (root["weekly_reset_min"].is<int>()) id(usage_weekly_reset_min) = root["weekly_reset_min"];
            if (root["epoch"].is<long>()) {
              struct timeval tv = { .tv_sec = root["epoch"], .tv_usec = 0 };
              settimeofday(&tv, nullptr);
              id(time_synced) = true;
            }
            if (root["ok"].is<bool>()) id(claude_ok) = root["ok"];
            if (root["project"].is<std::string>()) id(claude_project) = root["project"].as<std::string>();
            if (root["waiting"].is<bool>()) id(claude_waiting) = root["waiting"];
            return true;
          });
      - lvgl.widget.update:
          id: lbl_claude_connected
          text_color: !lambda 'return id(claude_ok) ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x444444);'
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            if (id(claude_project).empty()) return "";
            if (id(claude_waiting)) return id(claude_project) + " - waiting";
            return id(claude_project);
      - if:
          condition:
            lambda: 'return id(claude_waiting);'
          then:
            - light.turn_on:
                id: status_rgb
                effect: "waiting_blink"
          else:
            - light.turn_off: status_rgb
      - lvgl.bar.update:
          id: bar_usage_current
          value: !lambda 'return id(usage_current_pct);'
          indicator:
            bg_color: !lambda |-
              int pct = id(usage_current_pct);
              if (pct >= 90) return lv_color_hex(0xF44336);
              if (pct >= 70) return lv_color_hex(0xFF9800);
              return lv_color_hex(0x4CAF50);
      - lvgl.bar.update:
          id: bar_usage_weekly
          value: !lambda 'return id(usage_weekly_pct);'
          indicator:
            bg_color: !lambda |-
              int pct = id(usage_weekly_pct);
              if (pct >= 90) return lv_color_hex(0xF44336);
              if (pct >= 70) return lv_color_hex(0xFF9800);
              return lv_color_hex(0x4CAF50);
      - lvgl.label.update:
          id: lbl_usage_current_pct
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(usage_current_pct));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_weekly_pct
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(usage_weekly_pct));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_current_reset
          text: !lambda |-
            int m = id(usage_current_reset_min);
            char buf[24];
            snprintf(buf, sizeof(buf), "Resets in %dh %02dm", m / 60, m % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_usage_weekly_reset
          text: !lambda |-
            int m = id(usage_weekly_reset_min);
            char buf[24];
            snprintf(buf, sizeof(buf), "Resets in %dd %dh", m / 1440, (m % 1440) / 60);
            return std::string(buf);

#
# https://esphome.io/components/output
#
output:
  - id: backlight_pwm
    platform: ledc
    pin: ${PIN_BACKLIGHT}
  - id: led_r
    platform: ledc
    pin:
      number: ${PIN_LED_R}
      inverted: true
  - id: led_g
    platform: ledc
    pin:
      number: ${PIN_LED_G}
      inverted: true
  - id: led_b
    platform: ledc
    pin:
      number: ${PIN_LED_B}
      inverted: true

#
# https://esphome.io/components/light
#
light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    internal: true
    restore_mode: ALWAYS_ON
  - id: status_rgb
    platform: rgb
    name: Status LED
    internal: true
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: "waiting_blink"
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 54%
              blue: 24%
              duration: 500ms
            - state: false
              duration: 500ms

#
# https://esphome.io/components/sensor
#
sensor:
  - platform: adc
    pin: ${PIN_LDR}
    name: Ambient Light
    internal: true
    id: ambient_light
    attenuation: 12db
    update_interval: 30s

#
# https://esphome.io/components/display
#
display:
  - platform: mipi_spi
    id: esp_display
    # model: ESP32-2432S028
    model: ESP32-2432S028-7789
    spi_id: spi_bus
    cs_pin:
      number: ${PIN_TFT_CS}
      ignore_strapping_warning: true
    dc_pin:
      number: ${PIN_TFT_DC}
      ignore_strapping_warning: true
    data_rate: 40MHz
    color_order: BGR
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

#
# https://esphome.io/components/touchscreen
#
touchscreen:
  platform: xpt2046
  id: esp_touch
  spi_id: spi_bus
  cs_pin: ${PIN_TOUCH_CS}
  interrupt_pin: ${PIN_TOUCH_IRQ}
  data_rate: 2MHz
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 270
    x_max: 3870
    y_min: 420
    y_max: 3790
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: true

#
# https://esphome.io/components/image
#
image:
  - platform: file
    file: "img/claude-code-32.png"
    type: RGB
    transparency: alpha_channel
    id: claude_image_32
    resize: 32x20
  - platform: file
    file: "img/claude-code-128.png"
    type: RGB
    transparency: alpha_channel
    id: claude_image_128
    resize: 128x80

#
# https://esphome.io/components/lvgl
#
lvgl:
  buffer_size: 10%
  rotation: 90°
  theme:
    dark_mode: true
  top_layer:
    widgets: !include ui/status_bar_top.yaml
  pages:
    - <<: !include ui/splash_screen.yaml
    - <<: !include ui/main_screen.yaml
    