- id: main_screen
  bg_color: 0x000000
  pad_all: 0
  scrollbar_mode: "OFF"
  widgets:

    - obj:
        id: main_screen_title_bar
        x: 0
        y: 30
        width: 100%
        align: TOP_LEFT
        bg_opa: 0%
        border_width: 0
        pad_all: 0
        scrollbar_mode: "OFF"
        widgets:

          - image:
              id: main_screen_title_bar_image
              src: claude_image_32
              x: 0
              y: 0
              width: 32
              height: 20
              align: TOP_LEFT

          - label:
              id: main_screen_title_bar_label
              x: 40
              y: -5
              align: TOP_LEFT
              text: "Usage"
              text_color: 0xFFFFFF
              text_font: montserrat_24

    - obj:
        id: main_screen_content
        x: 0
        y: 0
        width: 240
        height: 200
        align: CENTER
        bg_opa: 0%
        border_width: 0
        pad_all: 0
        scrollbar_mode: "OFF"
        widgets:

          - obj:
              id: current_usage
              x: 0
              y: 0
              width: 100%
              height: 90
              align: TOP_MID
              bg_color: 0x333333
              border_width: 0
              radius: 4
              pad_all: 4
              scrollbar_mode: "OFF"
              widgets:

                - label:
                    id: lbl_usage_current_pct
                    x: 0
                    y: 0
                    align: TOP_LEFT
                    text: "--%"
                    text_color: 0xFFFFFF
                    text_font: montserrat_22

                - label:
                    id: lbl_usage_current_label
                    x: 0
                    y: -2
                    align: TOP_RIGHT
                    text: "Current"
                    text_color: 0xFFFFFF
                    bg_color: 0x666666
                    bg_opa: 100%
                    text_align: CENTER
                    text_font: montserrat_14
                    radius: 10
                    pad_all: 4

                - bar:
                    id: bar_usage_current
                    x: 0
                    y: 4
                    width: 100%
                    height: 24
                    align: CENTER
                    value: 0
                    min_value: 0
                    max_value: 100
                    indicator:
                      bg_color: 0x4CAF50
                    bg_color: 0x666666
                    radius: 10
                    bg_opa: 100%

                - label:
                    id: lbl_usage_current_reset
                    x: 0
                    y: 0
                    align: BOTTOM_LEFT
                    text: "Resets in --h --m"
                    text_color: 0xFFFFFF
                    text_font: montserrat_14

          - obj:
              id: lv_obj_weekly_usage
              x: 0
              y: 0
              width: 100%
              height: 90
              align: BOTTOM_MID
              bg_color: 0x333333
              border_width: 0
              radius: 4
              pad_all: 4
              scrollbar_mode: "OFF"
              widgets:

                - label:
                    id: lbl_usage_weekly_pct
                    x: 0
                    y: 0
                    align: TOP_LEFT
                    text: "--%"
                    text_color: 0xFFFFFF
                    text_font: montserrat_22

                - label:
                    id: lbl_usage_weekly_label
                    x: 0
                    y: -2
                    align: TOP_RIGHT
                    text: "Weekly"
                    text_color: 0xFFFFFF
                    bg_color: 0x666666
                    bg_opa: 100%
                    text_align: CENTER
                    text_font: montserrat_14
                    radius: 10
                    pad_all: 4

                - bar:
                    id: bar_usage_weekly
                    x: 0
                    y: 4
                    width: 100%
                    height: 24
                    align: CENTER
                    value: 0
                    min_value: 0
                    max_value: 100
                    indicator:
                      bg_color: 0x4CAF50
                    bg_color: 0x666666
                    radius: 10
                    bg_opa: 100%

                - label:
                    id: lbl_usage_weekly_reset
                    x: 0
                    y: 0
                    align: BOTTOM_LEFT
                    text: "Resets in --d --h"
                    text_color: 0xFFFFFF
                    text_font: montserrat_14
    
    - label:
        id: lbl_status
        x: 0
        y: -25
        align: BOTTOM_MID
        text: ""
        text_color: 0xFFFFFF
        text_font: montserrat_14

    - label:
        id: lbl_animated_text
        x: 0
        y: 0
        align: BOTTOM_MID
        text: "Working..."
        text_color: 0xFF8A3D
        text_font: montserrat_14