- id: splash_screen
  bg_color: 0x000000
  pad_all: 0
  scrollbar_mode: "OFF"
  widgets:

    - label:
        id: lbl_splash_name
        x: 0
        y: 20
        align: TOP_MID
        text: "${friendly_name}"
        text_color: 0xFFFFFF
        text_align: CENTER
        text_font: montserrat_28

    - image:
        id: lv_image_claude_128
        src: claude_image_128
        x: 0
        y: 0
        width: 128
        height: 80
        align: CENTER
        
    - label:
        id: lbl_splash_version
        x: 0
        y: -20
        align: BOTTOM_MID
        text: "${version}"
        text_font: montserrat_14
        text_color: 0xFFFFFF
        text_align: CENTER